name: CI Python adapter

on:
  push:
    branches: [main]
    paths: ['python/**', 'contracts/**', '.github/workflows/ci-python.yml']
  pull_request:
    paths: ['python/**', 'contracts/**', '.github/workflows/ci-python.yml']

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package in dev mode
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        working-directory: python
        run: ruff check src/ tests/ scripts/ examples/
      - name: Type check with mypy
        working-directory: python
        run: mypy --strict src/
      - name: Run tests
        working-directory: python
        run: pytest --cov=agent_did_evm -q
      - name: Build package
        if: matrix.python-version == '3.12'
        working-directory: python
        run: |
          pip install build
          python -m build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.python-version == '3.12'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install contract dependencies
        if: matrix.python-version == '3.12'
        run: npm --prefix contracts ci
      - name: Python revocation policy smoke
        if: matrix.python-version == '3.12'
        working-directory: python
        run: python scripts/revocation_policy_smoke.py
      - name: Python end-to-end smoke
        if: matrix.python-version == '3.12'
        working-directory: python
        run: python scripts/e2e_smoke.py
