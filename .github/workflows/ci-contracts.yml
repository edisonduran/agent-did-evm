name: CI contracts and smokes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Hardhat tests and TypeScript smokes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Hardhat 2.22 supports Node up to 22.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            evm/package-lock.json
      - run: npm --prefix contracts ci
      - run: npm --prefix contracts test
      - name: Revocation policy smoke
        run: npm run smoke:policy
      - name: End-to-end smoke (contract + @agentdid/evm + @agentdid/sdk)
        run: npm run smoke:e2e
