[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-did-evm"
version = "1.0.0rc5"
description = "Optional EVM registry adapter for Agent-DID (EvmAgentRegistry + web3.py contract client). Not required by agent-did-sdk."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "Agent-DID contributors" },
]
keywords = ["did", "agent", "identity", "evm", "registry", "web3"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "agent-did-sdk>=1.0.0rc4,<2",
  "web3>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/edisonduran/agent-did-evm#readme"
Repository = "https://github.com/edisonduran/agent-did-evm.git"
Bug-Tracker = "https://github.com/edisonduran/agent-did-evm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_did_evm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# did-webvh (pulled in by agent-did-sdk) and its JCS dependency ship without type information.
module = ["did_webvh", "did_webvh.*", "jsoncanon"]
ignore_missing_imports = true
